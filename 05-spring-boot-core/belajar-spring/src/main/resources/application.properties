spring.application.name=belajar-spring

# Menambah batas ukuran Request Header
server.max-http-request-header-size=64KB

# --- KONFIGURASI DATABASE H2 IN-MEMORY ---
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Aktifkan H2 Web Console di browser (http://127.0.0.1:8080/h2-console/)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Tampilkan query SQL otomatis dari Hibernate di terminal agar kita bisa belajar melihatnya
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Otomatis membuat/mengupdate tabel database berdasarkan class @Entity
spring.jpa.hibernate.ddl-auto=update

# Konfigurasi SpringDoc / Swagger
springdoc.override-with-generic-response=false
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
